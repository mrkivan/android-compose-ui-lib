name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Format check
        run: ./gradlew spotlessCheck

      - name: Unit tests
        run: ./gradlew :ui_library:testDebugUnitTest :app:testDebugUnitTest

      - name: Assemble
        run: ./gradlew :ui_library:assembleRelease :app:assembleDebug

      - name: Lint
        run: ./gradlew :app:lintDebug
