name: Publish UI Library

on:
  push:
    tags:
      - 'v*'  # Trigger only on tags like v1.0.0

# The job token is enough to publish to this repository's own package namespace; no PAT
# secret to rotate. The v2.4.2 runs failed with 401 because GH_PACKAGES_TOKEN was never set.
permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Never publish an artifact that does not pass the same gate as a pull request.
      - name: Format check and unit tests
        run: ./gradlew spotlessCheck :ui_library:testDebugUnitTest :app:testDebugUnitTest

      - name: Publish library to GitHub Packages
        run: ./gradlew :ui_library:publishReleasePublicationToGitHubRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
